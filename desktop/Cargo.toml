[package]
name = "remota-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "remota-desktop"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebRTC
webrtc = "0.13"

# WebSocket (for signaling)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mouse / keyboard injection (cross-platform)
enigo = "0.2"

# VP8 video encoding (BGRA → I420 → VP8)
# ffi-generate regenerates bindings at build time from installed headers,
# avoiding the pre-generated file version mismatch with libvpx 1.14
vpx-encode = { version = "0.6", features = ["ffi-generate"] }

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

# ── Windows-only ──────────────────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

# ── macOS-only ────────────────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "10", features = ["async"] }

[profile.release]
opt-level = 3
lto = true
