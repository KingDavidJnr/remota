[package]
name = "remota-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "remota-desktop"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebRTC
webrtc = "0.13"

# WebSocket (for signaling)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mouse / keyboard injection (participant side)
enigo = "0.2"

# VP8 video encoding (participant side: BGRA → I420 → VP8)
vpx-encode = { version = "0.6", features = ["ffi-generate"] }

# VP8 video decoding (controller side: RTP → VP8 → I420 → BGRA)
env-libvpx-sys = "5.1"

# Window rendering (controller side)
winit = "0.30"
softbuffer = "0.4"

# HTTP client for room creation (controller side)
ureq = { version = "2", features = ["native-tls"] }

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

# ── Windows-only ──────────────────────────────────────────────────────────────
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"

# ── macOS-only ────────────────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "10", features = ["async"] }

[profile.release]
opt-level = 3
lto = true
