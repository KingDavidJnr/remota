[package]
name = "remota-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "remota-desktop"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebRTC
webrtc = "0.13"

# WebSocket (for signaling)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Screen capture (Windows-native WinRT capture API)
windows-capture = "2"

# Mouse / keyboard injection
enigo = "0.2"

# VP8 video encoding (BGRA → I420 → VP8)
vpx = "0.3"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

# Win32 API (screen dimensions, Windows only)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
