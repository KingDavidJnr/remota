name: Build Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual trigger from GitHub Actions UI

jobs:
  build-windows:
    name: Build remota-desktop.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: windows-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install libvpx via vcpkg
        run: |
          vcpkg install libvpx:x64-windows-static
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Build release binary
        env:
          REMOTA_WS_URL: wss://api.remota.quickdesk.tech
          REMOTA_TURN_URL: turn:turn.remota.quickdesk.tech:3478
          REMOTA_TURN_USER: ${{ secrets.REMOTA_TURN_USER }}
          REMOTA_TURN_PASS: ${{ secrets.REMOTA_TURN_PASS }}
          VCPKGRS_DYNAMIC: 0
          VPX_STATIC: 1
          VPX_VERSION: 1.14.0
          VPX_LIB_DIR: ${{ env.VCPKG_ROOT }}\installed\x64-windows-static\lib
          VPX_INCLUDE_DIR: ${{ env.VCPKG_ROOT }}\installed\x64-windows-static\include
        run: cargo build --release --manifest-path desktop/Cargo.toml --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Rename binary
        run: |
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/remota-desktop.exe" "remota-desktop.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remota-desktop-windows
          path: remota-desktop.exe
          retention-days: 90

      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: remota-desktop.exe
          generate_release_notes: true
