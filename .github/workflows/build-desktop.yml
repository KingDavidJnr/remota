name: Build Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build remota-desktop.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: windows-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install libvpx via vcpkg and build
        env:
          REMOTA_WS_URL: wss://api.remota.quickdesk.tech
          REMOTA_TURN_URL: turn:turn.remota.quickdesk.tech:3478
          REMOTA_TURN_USER: ${{ secrets.REMOTA_TURN_USER }}
          REMOTA_TURN_PASS: ${{ secrets.REMOTA_TURN_PASS }}
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          Write-Output "vcpkg: $vcpkg"

          # Install libvpx static
          & "$vcpkg\vcpkg.exe" install "libvpx:x64-windows-static"

          $libDir     = "$vcpkg\installed\x64-windows-static\lib"
          $includeDir = "$vcpkg\installed\x64-windows-static\include"

          Write-Output "lib dir contents:"
          Get-ChildItem $libDir | Where-Object { $_.Name -like "*vpx*" }

          # vcpkg installs vpx.lib but env-libvpx-sys links libvpx.lib on Windows.
          # Create a copy with the expected name.
          $vpxLib = Join-Path $libDir "vpx.lib"
          $libvpxLib = Join-Path $libDir "libvpx.lib"
          if ((Test-Path $vpxLib) -and -not (Test-Path $libvpxLib)) {
            Write-Output "Copying vpx.lib -> libvpx.lib"
            Copy-Item $vpxLib $libvpxLib
          }

          Write-Output "lib dir after copy:"
          Get-ChildItem $libDir | Where-Object { $_.Name -like "*vpx*" }

          $env:VPX_LIB_DIR     = $libDir
          $env:VPX_INCLUDE_DIR = $includeDir
          $env:VPX_STATIC      = "1"
          $env:VPX_VERSION     = "1.13.0"

          Write-Output "Building..."
          cargo build --release `
            --manifest-path desktop/Cargo.toml `
            --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Rename binary
        run: |
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/remota-desktop.exe" "remota-desktop.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remota-desktop-windows
          path: remota-desktop.exe
          retention-days: 90

      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: remota-desktop.exe
          generate_release_notes: true
