name: Build Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build remota-desktop.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: windows-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install libvpx via vcpkg
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          Write-Output "vcpkg: $vcpkg"

          & "$vcpkg\vcpkg.exe" install "libvpx:x64-windows-static"

          $libDir     = "$vcpkg\installed\x64-windows-static\lib"
          $includeDir = "$vcpkg\installed\x64-windows-static\include"

          # Get the actual installed version
          $portfile = "$vcpkg\installed\x64-windows-static\share\libvpx\vcpkg_abi_info.txt"
          if (Test-Path $portfile) {
            $ver = Get-Content $portfile | Select-Object -First 1
            Write-Output "libvpx installed version info: $ver"
          }

          # vcpkg names it vpx.lib — env-libvpx-sys expects libvpx.lib on Windows
          $vpxLib    = Join-Path $libDir "vpx.lib"
          $libvpxLib = Join-Path $libDir "libvpx.lib"
          if ((Test-Path $vpxLib) -and -not (Test-Path $libvpxLib)) {
            Copy-Item $vpxLib $libvpxLib
            Write-Output "Copied vpx.lib -> libvpx.lib"
          }

          # Get the actual version number from the installed headers
          $headerFile = "$includeDir\vpx\vpx_codec.h"
          $verLine = Select-String -Path $headerFile -Pattern "VPX_VERSION_PATCH" | Select-Object -First 1
          Write-Output "Version line: $verLine"

          # Get the actual version from vcpkg portfile
          $vpxVersion = (& "$vcpkg\vcpkg.exe" list libvpx 2>&1) |
            Select-String "libvpx:x64-windows-static" |
            ForEach-Object { ($_ -split '\s+')[1] } |
            Select-Object -First 1

          if (-not $vpxVersion) { $vpxVersion = "1.14.0" }
          Write-Output "libvpx version: $vpxVersion"

          # Use ffi-generate feature so bindgen regenerates at build time
          # This avoids the pre-generated file version mismatch entirely
          echo "VPX_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "VPX_INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          echo "VPX_STATIC=1" >> $env:GITHUB_ENV
          echo "VPX_VERSION=$vpxVersion" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build release binary
        env:
          REMOTA_WS_URL: wss://api.remota.quickdesk.tech
          REMOTA_WEB_URL: https://remota.quickdesk.tech
          REMOTA_TURN_URL: turn:turn.remota.quickdesk.tech:3478
          REMOTA_TURN_USER: ${{ secrets.REMOTA_TURN_USER }}
          REMOTA_TURN_PASS: ${{ secrets.REMOTA_TURN_PASS }}
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          Write-Output "VPX_LIB_DIR=$env:VPX_LIB_DIR"
          Write-Output "VPX_INCLUDE_DIR=$env:VPX_INCLUDE_DIR"
          cargo build --release `
            --manifest-path desktop/Cargo.toml `
            --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Rename binary
        run: |
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/remota-desktop.exe" "remota-desktop.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remota-desktop-windows
          path: remota-desktop.exe
          retention-days: 90

      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: remota-desktop.exe
          generate_release_notes: true
