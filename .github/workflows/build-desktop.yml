name: Build Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build remota-desktop.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: windows-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install libvpx 1.13.0 via vcpkg
        run: |
          # vcpkg is pre-installed on windows-latest runners
          # Override the version to 1.13.0 to match env-libvpx-sys pre-generated FFI
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          Write-Output "vcpkg root: $vcpkg"
          
          # Install libvpx static
          & "$vcpkg\vcpkg.exe" install "libvpx:x64-windows-static"
          
          $libDir = "$vcpkg\installed\x64-windows-static\lib"
          $includeDir = "$vcpkg\installed\x64-windows-static\include"
          
          # Get the actual installed version
          $version = & "$vcpkg\vcpkg.exe" list libvpx 2>&1 | Select-String "libvpx" | ForEach-Object { ($_ -split '\s+')[1] } | Select-Object -First 1
          Write-Output "Installed libvpx version: $version"
          
          echo "VPX_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "VPX_INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          echo "VPX_STATIC=1" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Detect libvpx version for FFI
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          $raw = & "$vcpkg\vcpkg.exe" list 2>&1 | Select-String "libvpx:x64-windows-static"
          Write-Output "vcpkg list output: $raw"
          # Extract version like 1.14.0 → try 1.13.0 fallback if not in pre-gen list
          $ver = if ($raw -match '(\d+\.\d+\.\d+)') { $Matches[1] } else { "1.13.0" }
          # env-libvpx-sys only has pre-gen up to 1.13.0 — use that if vcpkg installs newer
          $supported = @("1.13.0","1.12.0","1.11.0","1.10.0","1.9.0","1.8.2","1.8.1","1.8.0","1.7.0")
          if ($ver -notin $supported) {
            Write-Output "vcpkg installed $ver which has no pre-gen FFI, forcing VPX_VERSION=1.13.0"
            $ver = "1.13.0"
          }
          Write-Output "Using VPX_VERSION=$ver"
          echo "VPX_VERSION=$ver" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build release binary
        env:
          REMOTA_WS_URL: wss://api.remota.quickdesk.tech
          REMOTA_TURN_URL: turn:turn.remota.quickdesk.tech:3478
          REMOTA_TURN_USER: ${{ secrets.REMOTA_TURN_USER }}
          REMOTA_TURN_PASS: ${{ secrets.REMOTA_TURN_PASS }}
        run: |
          Write-Output "VPX_LIB_DIR=$env:VPX_LIB_DIR"
          Write-Output "VPX_INCLUDE_DIR=$env:VPX_INCLUDE_DIR"
          Write-Output "VPX_VERSION=$env:VPX_VERSION"
          Write-Output "VPX_STATIC=$env:VPX_STATIC"
          cargo build --release --manifest-path desktop/Cargo.toml --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Rename binary
        run: |
          Copy-Item "desktop/target/x86_64-pc-windows-msvc/release/remota-desktop.exe" "remota-desktop.exe"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remota-desktop-windows
          path: remota-desktop.exe
          retention-days: 90

      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: remota-desktop.exe
          generate_release_notes: true
